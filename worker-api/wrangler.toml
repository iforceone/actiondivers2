name = "actiondivers-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Non-secret config. Edit these to taste.
[vars]
# Where inquiries are delivered. Point at a test inbox while testing, then switch to the live one.
TO_EMAIL = "reservations@actiondiversbelize.com"
# Verified sender (the domain must be verified in Resend). Name + address form is fine.
FROM_EMAIL = "Action Divers & Adventures <reservations@actiondiversbelize.com>"
# Comma-separated site origins allowed to POST to this Worker (no trailing slash).
ALLOWED_ORIGINS = "https://actiondivers2.davebze.workers.dev,http://localhost:3000"

# Rate limits are per client IP. `period` must be 10 or 60; each block needs its
# own namespace_id. Requires wrangler 4 — v3 ignores these silently.

# Reservation form: 5 per minute is plenty for a human filling out a form.
[[ratelimits]]
name = "INQUIRY_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Tour Assistant: every call bills against our Gemini quota, so cap chattiness.
[[ratelimits]]
name = "ASSISTANT_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 12
  period = 60

# RESEND_API_KEY and GEMINI_API_KEY are SECRETS — never put them here. Set with:
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put GEMINI_API_KEY
