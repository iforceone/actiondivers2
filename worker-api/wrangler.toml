name = "actiondivers-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

# Non-secret config. Edit these to taste.
[vars]
# Where inquiries are delivered. Must be a real mailbox — reservations@ does not
# exist and bounced with "Recipient not found" (MX records prove the domain accepts
# mail, not that a given address does).
TO_EMAIL = "info@actiondiversbelize.com"
# Verified sender (the domain must be verified in Resend). Name + address form is fine.
# Kept on a real mailbox so bounce notifications land somewhere and filters don't
# penalise a From address that can't receive mail.
FROM_EMAIL = "Action Divers & Adventures <info@actiondiversbelize.com>"
# Comma-separated site origins allowed to POST to this Worker (no trailing slash).
ALLOWED_ORIGINS = "https://actiondivers2.davebze.workers.dev,https://codex-action-divers-work-actiondivers2.davebze.workers.dev,http://localhost:3000"
PAYMENT_ENVIRONMENT = "sandbox"
PAYMENT_SITE_ORIGIN = "https://actiondivers2.davebze.workers.dev"
# Launch gates. Staff is enabled only after D1 and Cloudflare Access verification;
# reservations and payments stay off until their remaining launch checks pass.
RESERVATIONS_V2_ENABLED = "false"
STAFF_PORTAL_ENABLED = "true"
PAYMENTS_ENABLED = "false"
# Non-secret Cloudflare Access configuration for the path-protected site and API
# staff routes. Staff membership is stored in D1; keep OWNER_EMAILS empty unless
# emergency bootstrap access is intentionally required.
ACCESS_TEAM_DOMAIN = "https://muddy-frog-9df5.cloudflareaccess.com"
ACCESS_AUD = "d3721f0fa2596469241c5ad06b2779828b01bcebd6ba2bd19d8d17e81e477228"
OWNER_EMAILS = ""

# Shared reservation, quote, portal, and payment-intent storage. Preview and
# production use separate databases; IDs are non-secret Cloudflare resource IDs.
[[d1_databases]]
binding = "PAYMENTS_DB"
database_name = "actiondivers-reservations-production"
database_id = "d3d3ec34-c463-4f36-af2c-5ab32a45acda"
preview_database_id = "086ef147-6256-4087-8b48-df79237c16f5"
migrations_dir = "migrations"

# Rate limits are per client IP. `period` must be 10 or 60; each block needs its
# own namespace_id. Requires wrangler 4 — v3 ignores these silently.

# Reservation form: 5 per minute is plenty for a human filling out a form.
[[ratelimits]]
name = "INQUIRY_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Tour Assistant: every call bills against our Gemini quota, so cap chattiness.
[[ratelimits]]
name = "ASSISTANT_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 12
  period = 60

# Guest payment detail, start, and refresh requests.
[[ratelimits]]
name = "PAYMENT_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 10
  period = 60

# RESEND_API_KEY and GEMINI_API_KEY are SECRETS — never put them here. Set with:
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put BELIZE_BANK_USERNAME
#   npx wrangler secret put BELIZE_BANK_PASSWORD
